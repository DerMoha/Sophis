name: sophis
description: A clean, minimalistic calorie and nutrition tracking app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Core
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  intl: ^0.20.2

  # Design System - Typography
  
  # Phase 2
  fl_chart: ^1.1.1
  mobile_scanner: ^7.1.4
  http: ^1.2.0
  
  # Phase 3: AI
  google_generative_ai: ^0.4.6
  google_mlkit_text_recognition: ^0.16.0
  image_picker: ^1.0.7
  
  # Phase 5: Notifications
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.1
  flutter_secure_storage: ^10.0.0
  local_auth: ^3.0.2

  # Phase 7: Meal Planning
  share_plus: ^12.0.2
  url_launcher: ^6.2.5

  # Meal Sharing
  qr_flutter: ^4.1.0
  app_links: ^7.2.1
  home_widget: ^0.9.3

  # Phase 8: Data Export/Import
  file_picker: ^11.0.2
  path_provider: ^2.1.5
  package_info_plus: ^9.0.1
  drift: ^2.30.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path: ^1.9.1

  uuid: ^4.5.2
  gal: ^2.3.2
  image: ^4.9.1
  archive: ^4.0.9
  
  # Phase 6: Health Integration (Apple HealthKit)
  health: ^13.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.30.1
  build_runner: ^2.10.5
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: DM Serif Display
      fonts:
        - asset: assets/fonts/DMSerifDisplay-Regular.ttf
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
